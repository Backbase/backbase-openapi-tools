openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Petstore 3.1
  version: 1.0.0
servers:
  - url: http://localhost:4010
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        "200":
          description: A list of pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
webhooks:
  petAdded:
    post:
      operationId: petAdded
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "200":
          description: Acknowledged.
components:
  schemas:
    Pet:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type:
            - string
            - "null"
        kind:
          const: pet
        age:
          type: integer
          format: int32
          exclusiveMinimum: 0
          maximum: 30
