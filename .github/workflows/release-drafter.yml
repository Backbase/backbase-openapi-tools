name: Release Drafter

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  correct_repository:
    runs-on: ubuntu-latest
    steps:
    - name: fail on fork
      if: github.repository_owner != 'Backbase'
      run: exit 1

  update_release_draft:
    needs: correct_repository
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@73b95fa1c286dfd6802a4f949b07dad6149f2b0f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}