name: Release Drafter

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  correct_repository:
    runs-on: ubuntu-latest
    steps:
    - name: fail on fork
      if: github.repository_owner != 'Backbase'
      run: exit 1

  update_release_draft:
    needs: correct_repository
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}