asyncapi: 3.0.0
info:
  title: Approval Events
  version: 1.0.0
  description: >-
    Two CloudEvents in JSON Schema 2020-12 in one document: the service receives approval requests and sends the
    decisions. The operations have no tags, so each is grouped under its channel key. The envelopes, their data and
    the schemas both events use (shared/schemas) are registered as Multi Format Schema Objects.
channels:
  approvalRequests:
    address: approval-requests
    x-producers:
      - ums
    x-consumers:
      - approval
    messages:
      ApprovalRequest:
        $ref: '#/components/messages/ApprovalRequest'
  approvalDecision:
    address: approval-decision
    x-producers:
      - approval
    x-consumers:
      - ums
    messages:
      ApprovalDecision:
        $ref: '#/components/messages/ApprovalDecision'
operations:
  receiveApprovalRequest:
    action: receive
    channel:
      $ref: '#/channels/approvalRequests'
    messages:
      - $ref: '#/channels/approvalRequests/messages/ApprovalRequest'
  sendApprovalDecision:
    action: send
    channel:
      $ref: '#/channels/approvalDecision'
    messages:
      - $ref: '#/channels/approvalDecision/messages/ApprovalDecision'
components:
  schemas:
    ApprovalRequestCloudEvent:
      schemaFormat: application/schema+yaml;version=draft-2020-12
      schema:
        $ref: schemas/approval-request-cloud-event.yaml
    ApprovalRequestData:
      schemaFormat: application/schema+yaml;version=draft-2020-12
      schema:
        $ref: schemas/approval-request-data.yaml
    ApprovalDecisionCloudEvent:
      schemaFormat: application/schema+yaml;version=draft-2020-12
      schema:
        $ref: schemas/approval-decision-cloud-event.yaml
    ApprovalDecisionData:
      schemaFormat: application/schema+yaml;version=draft-2020-12
      schema:
        $ref: schemas/approval-decision-data.yaml
    RequestType:
      schemaFormat: application/schema+yaml;version=draft-2020-12
      schema:
        $ref: shared/schemas/request-type.yaml
    Scope:
      schemaFormat: application/schema+yaml;version=draft-2020-12
      schema:
        $ref: shared/schemas/scope.yaml
  messages:
    ApprovalRequest:
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApprovalRequestCloudEvent'
    ApprovalDecision:
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApprovalDecisionCloudEvent'
