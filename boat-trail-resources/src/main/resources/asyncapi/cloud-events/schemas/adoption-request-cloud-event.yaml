$schema: https://json-schema.org/draft/2020-12/schema
title: AdoptionRequestCloudEvent
type: object
required: [specversion, id, type, data]
properties:
  specversion:
    type: string
    const: '1.0'
  id:
    type: string
    format: uuid
  type:
    type: string
    const: adoption.request
  sourcetype:
    type: string
    enum: [store, web]
  storeid:
    type: string
  data:
    $ref: adoption-request-data.yaml
if:
  properties:
    sourcetype:
      const: store
then:
  required: [storeid]
additionalProperties: false
