$schema: https://json-schema.org/draft/2020-12/schema
title: AdoptionDecisionCloudEvent
type: object
required: [specversion, id, data]
properties:
  specversion:
    type: string
    const: '1.0'
  id:
    type: string
    format: uuid
  sourcetype:
    type: string
    enum: [store, web]
  storeid:
    type: string
  data:
    $ref: specification.yaml
if:
  properties:
    sourcetype:
      const: store
then:
  required: [storeid]
additionalProperties: false
