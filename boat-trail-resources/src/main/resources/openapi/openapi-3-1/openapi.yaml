openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Presentation Thing Service API
  version: 1.0.0
servers:
  - url: http://localhost:4010
paths:
  /client-api/things:
    get:
      operationId: getThings
      tags:
        - Things
      responses:
        "200":
          description: The things.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Thing"
webhooks:
  thingChanged:
    post:
      operationId: thingChanged
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Thing"
      responses:
        "200":
          description: Acknowledged.
components:
  schemas:
    Thing:
      type: object
      properties:
        # 3.1 constructs that the OAS 3.0 JSON schema used by zally rule 219 cannot validate.
        nickname:
          type:
            - string
            - "null"
          maxLength: 50
        kind:
          const: thing
        theNumber:
          type: integer
          format: int32
          exclusiveMinimum: 0
          maximum: 10
